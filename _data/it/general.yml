title_announcement: "Express@5.1.0: Ora il Predefinito il npm con LTS Timeline"
body_announcement: "Express 5.1.0 è ora il default su npm, e stiamo introducendo un programma LTS ufficiale per le linee di rilascio v4 e v5. <a href='https://expressjs.com/2025/03/31/v5-1-latest-release.html'>Scopri il nostro ultimo blog per ulteriori informazioni.</a>"
